name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (swift-tools-version) and newest release, each with the Visual Studio of its time:
        # the C++ headers of Visual Studio 2026 (MSVC 14.51) require Clang 20, newer than the one in Swift 6.2.
        include:
          - swift: "6.2.4"
            os: windows-2022
          - swift: "6.4.1"
            os: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-${{ matrix.swift }}-release
          swift-build: ${{ matrix.swift }}-RELEASE

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build --skip Live

      - name: Package the aso command (release, with its Swift runtime DLLs)
        if: matrix.swift == '6.4.1'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package-windows.ps1

      - name: Upload the aso command
        if: matrix.swift == '6.4.1'
        uses: actions/upload-artifact@v4
        with:
          name: aso-windows-x86_64
          path: |
            dist/aso-windows-x86_64.zip
            dist/aso-windows-x86_64.sha256
          if-no-files-found: error
