name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Swift ${{ matrix.swift }}
    runs-on: ubuntu-24.04
    container: swift:${{ matrix.swift }}-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (swift-tools-version) and newest release.
        swift: ["6.2", "6.4"]
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        # The Swift images ship the SQLite runtime but not its header, which ASOEngine builds against.
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build --skip Live

      - name: Build the aso command (release, Swift runtime linked in)
        if: matrix.swift == '6.4'
        run: |
          swift build -c release --product aso --static-swift-stdlib
          bin="$(swift build -c release --show-bin-path)"
          "$bin/aso" --version
          mkdir -p dist
          tar -czf dist/aso-linux-x86_64.tar.gz -C "$bin" aso

      - name: Upload the aso command
        if: matrix.swift == '6.4'
        uses: actions/upload-artifact@v4
        with:
          name: aso-linux-x86_64
          path: dist/aso-linux-x86_64.tar.gz
          if-no-files-found: error
